# Continuous integration for the Varbase AI MCP Server recipe.
#
# The repository is private, so this runs on GitHub Actions rather than the
# drupal.org GitLab templates the public Varbase recipes use. Two jobs:
#
#   lint    composer.json, every YAML file, and no PHP file in the recipe.
#   recipe  a real Varbase 11 site, built as Vardot's public recipe CI builds
#           one (drupal/varbase_project 11.0.x-dev, installed from Varbase
#           Starter). Require this checkout, apply the recipe twice (it must be
#           safe to re-apply) and run the inline checks, which need no key
#           and no OAuth client. Then it serves the site, checks the OAuth discovery
#           documents and the 401 challenge on /mcp with curl, and runs the
#           functional suite in
#           tests/features (Playwright + Cucumber through @vardot/varbase-e2e)
#           in Chromium.

name: CI

on:
  push:
    branches: ['1.0.x']
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  DRUPAL_CORE: '~11.4.0'
  RECIPE: varbase_ai_mcp_server_base
  PACKAGE: vardot/varbase_ai_mcp_server_base
  COMPOSER_NO_INTERACTION: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-publish

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint YAML
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          files = sorted(set(glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True) + glob.glob('.github/**/*.yml', recursive=True)))
          bad = 0
          for f in files:
              try:
                  list(yaml.safe_load_all(open(f, encoding='utf-8')))
              except Exception as e:
                  print(f'::error file={f}::{e}')
                  bad += 1
          print(f'{len(files)} YAML files checked, {bad} with errors')
          sys.exit(1 if bad else 0)
          PY

      - name: No PHP in the recipe
        run: |
          # A recipe ships config only: no .php, .module, .install or .inc file.
          found=$(find . -path ./.git -prune -o -path ./vendor -prune -o -path ./node_modules -prune -o -type f \( -name '*.php' -o -name '*.module' -o -name '*.install' -o -name '*.inc' \) -print)
          if [ -n "$found" ]; then echo "::error::PHP files found: $found"; exit 1; fi
          echo 'No PHP files.'

  recipe:
    name: Apply on a Varbase 11 site (Varbase Starter)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # A throw-away test site. Composer 2.9 refuses packages with open security
      # advisories, and since 8 October 2026 every enshrined/svg-sanitize release,
      # which Varbase Media Base needs through svg_image, has one. Production
      # sites decide on advisories themselves; this site only has to build.
      COMPOSER_NO_SECURITY_BLOCKING: '1'
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: drupal
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          path: recipe

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: gd, pdo_mysql, mysqli, mbstring, intl, zip, bcmath, opcache, pcntl
          # As a served site runs: assertions off (Vardot's recipe CI does the
          # same, for an upstream SDC prop mismatch in media rendering).
          ini-values: memory_limit=-1, zend.assertions=-1
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-varbase-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('recipe/composer.json') }}
          restore-keys: composer-varbase-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Build a Varbase 11 site that requires this checkout
        run: |
          # The Varbase project template, as Vardot's public recipe CI uses it,
          # with Varbase's curated patches. Retried: drupal.org clones can reset.
          for i in 1 2 3; do
            composer create-project drupal/varbase_project:11.0.x-dev site --no-install --no-interaction --no-scripts --ignore-platform-req=ext-pgsql && break
            echo "create-project attempt $i failed, retrying"; rm -rf site; sleep 20
          done
          cd site
          # Temporary pin. vardot/varbase-patches 11.0.48 (8 October 2026) re-rolled
          # the tagify #3555084 patch (MR 270) against a base no tagify release
          # matches, so composer-patches, which uses git apply, cannot apply it
          # to tagify 1.2.53, 1.2.54 or 1.2.55. 11.0.47's patch (MR 177) applies
          # to tagify up to 1.2.54. Drop both pins once the patch is re-rolled.
          composer require --no-update vardot/varbase-patches:11.0.47 drupal/tagify:1.2.54
          composer config minimum-stability dev
          composer config repositories.recipe "{\"type\": \"path\", \"url\": \"../recipe\", \"options\": {\"symlink\": false, \"versions\": {\"${PACKAGE}\": \"1.0.x-dev\"}}}"
          composer config --json extra.drupal-recipe-unpack.ignore "[\"${PACKAGE}\"]"
          # Twig stays below 3.30, which
          # breaks the cva module Varbase uses (as Vardot's recipe CI pins it).
          for i in 1 2 3; do
            composer require "${PACKAGE}:1.0.x-dev" "twig/twig:<3.30" -W --no-interaction --ignore-platform-req=ext-pgsql && break
            echo "require attempt $i failed, retrying"; sleep 15
          done
          test -d web/core
          composer show --no-ansi | grep -E 'drupal/(core|mcp|mcp_server|mcp_server_oauth|mcp_server_tool_bridge|simple_oauth|tool|tool_belt|consumers|varbase_starter|vartheme_bs5) |e0ipso/simple_oauth_21 |vardot/|twig/twig |drupal/tagify '

      - name: Patch core 2741429, as Vardot's recipe CI does
        working-directory: site
        run: |
          # A guard for a NULL view mode in EntityDisplayBase that a Varbase
          # install can hit before vardot/varbase-patches is active.
          curl -fsSL -o /tmp/2741429.patch "https://raw.githubusercontent.com/Vardot/drupal-core-patches/refs/heads/patches/drupal-core--2026-07-02--2741429--entitydisplaybase-null-mode-entity.patch"
          if patch -p1 -d web --forward --dry-run < /tmp/2741429.patch; then
            patch -p1 -d web --forward < /tmp/2741429.patch
          else
            echo "core 2741429 already applied"
          fi

      - name: Install Varbase Starter
        working-directory: site
        run: |
          bin/drush site:install "$PWD/recipes/varbase_starter" --db-url=mysql://root:root@127.0.0.1:3306/drupal \
            --account-name=admin --account-pass=admin --site-name="Recipe CI" --locale=en -y
          bin/drush cr

      - name: Apply the recipe
        working-directory: site
        run: |
          bin/drush recipe "$PWD/recipes/${RECIPE}"
          bin/drush cr

      - name: Apply the recipe again
        working-directory: site
        run: bin/drush recipe "$PWD/recipes/${RECIPE}"

      - name: Check the recipe without an AI key
        working-directory: site
        run: |
          # The checks run inline: the recipe ships no PHP file. Each prints PASS or FAIL,
          # then RESULT, and a failure throws so that drush exits non-zero.
          bin/drush php:eval "$(cat <<'PHP'
          // Optional arguments of the old tests/verify.php; CI passes only these.
          $extra = [];
          $failed = FALSE;
          $check = function (string $label, bool $ok, string $detail = '') use (&$failed): void {
            if (!$ok) {
              $failed = TRUE;
            }
            echo sprintf("%-4s %s%s\n", $ok ? 'PASS' : 'FAIL', $label, $detail !== '' ? " ($detail)" : '');
          };
          $info = function (string $label, string $detail = ''): void {
            echo sprintf("INFO %s%s\n", $label, $detail !== '' ? " ($detail)" : '');
          };

          $modules = [
            'serialization', 'consumers', 'simple_oauth', 'simple_oauth_21',
            'simple_oauth_server_metadata', 'simple_oauth_pkce',
            'simple_oauth_client_registration', 'tool', 'mcp_server',
            'mcp_server_tool_bridge', 'mcp_server_oauth', 'tool_belt',
            'tool_belt_entity', 'tool_belt_content', 'mcp',
          ];
          $module_handler = \Drupal::moduleHandler();
          $missing = array_values(array_filter($modules, fn(string $m) => !$module_handler->moduleExists($m)));
          $check('the MCP and OAuth 2.1 modules are enabled', $missing === [], $missing ? 'missing: ' . implode(', ', $missing) : count($modules) . ' modules');

          $etm = \Drupal::entityTypeManager();

          // Scopes: mcp:read and mcp:write usable, mcp:publish never.
          $scopes = $etm->getStorage('oauth2_scope');
          foreach (['mcp_read' => 'mcp:read', 'mcp_write' => 'mcp:write', 'mcp_publish' => 'mcp:publish'] as $id => $name) {
            $scope = $scopes->load($id);
            $check("scope $name exists", $scope !== NULL && $scope->get('name') === $name);
            if (!$scope) {
              continue;
            }
            $grants = $scope->get('grant_types') ?? [];
            foreach (['authorization_code', 'refresh_token', 'client_credentials'] as $grant) {
              if ($id === 'mcp_publish') {
                $check("scope $name has the $grant grant disabled", empty($grants[$grant]['status']));
              }
              else {
                $check("scope $name allows the $grant grant", !empty($grants[$grant]['status']));
              }
            }
            $check("scope $name is bounded by the mcp_agent role", $scope->get('granularity_id') === 'role'
              && ($scope->get('granularity_configuration')['role'] ?? '') === 'mcp_agent');
          }

          // The role behind every token: read, connect and draft, exactly.
          $role = $etm->getStorage('user_role')->load('mcp_agent');
          $check('role mcp_agent exists', $role !== NULL);
          if ($role) {
            $allowed = [
              'access mcp server', 'access content', 'grant simple_oauth codes',
              'use text format content_format',
              'create blog content', 'edit own blog content',
              'create page content', 'edit own page content',
              'view own unpublished content',
              'use varbase_editorial_workflow transition create_new_draft',
            ];
            $have = $role->getPermissions();
            $missing_p = array_values(array_diff($allowed, $have));
            $extra_p = array_values(array_diff($have, $allowed));
            $check('role mcp_agent has exactly the read and draft permissions', $missing_p === [] && $extra_p === [] && !$role->isAdmin(),
              trim(($missing_p ? 'missing: ' . implode(', ', $missing_p) . ' ' : '') . ($extra_p ? 'extra: ' . implode(', ', $extra_p) : '')));
          }

          // Draft creation lands in the draft state of the Varbase workflow.
          $workflow = $etm->getStorage('workflow')->load('varbase_editorial_workflow');
          $check('workflow varbase_editorial_workflow has create_new_draft ending in draft', $workflow
            && $workflow->getTypePlugin()->hasTransition('create_new_draft')
            && $workflow->getTypePlugin()->getTransition('create_new_draft')->to()->id() === 'draft');

          // Exposed tools: read tools behind mcp:read, draft tools behind mcp:write.
          $expected = [
            'tool_belt_entity_type_list' => ['tool_belt:entity_type_list', 'mcp:read'],
            'tool_belt_entity_bundle_field_definitions' => ['tool_belt:entity_bundle_field_definitions', 'mcp:read'],
            'tool_belt_entity_field_value_definitions' => ['tool_belt:entity_field_value_definitions', 'mcp:read'],
            'tool_belt_entity_list' => ['tool_belt:entity_list', 'mcp:read'],
            'tool_belt_entity_load_by_id' => ['tool_belt:entity_load_by_id', 'mcp:read'],
            'tool_belt_entity_field_values' => ['tool_belt:entity_field_values', 'mcp:read'],
            'tool_belt_entity_load_by_property' => ['tool_belt:entity_load_by_property', 'mcp:read'],
            'tool_belt_entity_metadata' => ['tool_belt:entity_metadata', 'mcp:read'],
            'tool_belt_entity_stub' => ['tool_belt:entity_stub', 'mcp:write'],
            'tool_belt_entity_revision_add' => ['tool_belt:entity_revision_add', 'mcp:write'],
            'tool_belt_field_set_value' => ['tool_belt:field_set_value', 'mcp:write'],
            'tool_belt_entity_save' => ['tool_belt:entity_save', 'mcp:write'],
          ];
          $definitions = \Drupal::service('plugin.manager.tool')->getDefinitions();
          $configs = $etm->getStorage('mcp_tool_config')->loadMultiple();
          foreach ($expected as $id => [$tool_id, $scope_name]) {
            $config = $configs[$id] ?? NULL;
            $ok = $config && $config->status() && $config->get('tool_id') === $tool_id
              && $config->getThirdPartySetting('mcp_server_oauth', 'authentication_mode') === 'required'
              && $config->getThirdPartySetting('mcp_server_oauth', 'scopes') === [$scope_name];
            $check("tool $id exposed, requiring $scope_name", (bool) $ok);
            $check("tool plugin $tool_id exists", isset($definitions[$tool_id]));
          }

          $enabled = array_filter($configs, fn($c) => $c->status());
          $unexpected = array_values(array_diff(array_keys($enabled), array_keys($expected)));
          $check('no other tool is enabled on /mcp', $unexpected === [], $unexpected ? implode(', ', $unexpected) : count($enabled) . ' tools');
          $dangerous = array_values(array_filter($enabled, fn($c) => (bool) preg_match('/(delete|publish|entity_create|entity_update)/', (string) $c->get('tool_id'))));
          $check('no delete, publish or one-shot create/update tool is exposed', $dangerous === [], $dangerous ? implode(', ', array_map(fn($c) => $c->id(), $dangerous)) : '');

          // OAuth 2.1: S256 only.
          $pkce = \Drupal::config('simple_oauth_pkce.settings');
          $check('PKCE is mandatory, S256 only', $pkce->get('enforcement') === 'mandatory' && $pkce->get('s256_enabled') === TRUE && $pkce->get('plain_enabled') === FALSE);

          $instructions = (string) \Drupal::config('mcp_server.settings')->get('server_instructions');
          $check('server instructions keep writes as drafts and never publish', str_contains($instructions, 'Every write is a draft') && str_contains($instructions, 'never publishes') && str_contains($instructions, 'non-default revision'));

          // Runtime state the recipe does not create.
          $settings = \Drupal::config('simple_oauth.settings');
          $keys = (string) $settings->get('public_key') !== '' && is_readable((string) $settings->get('public_key'))
            && is_readable((string) $settings->get('private_key'));
          $info('OAuth signing keys', $keys ? 'configured' : 'not configured yet, see README "After the apply"');
          $clients = (int) $etm->getStorage('consumer')->getQuery()->accessCheck(FALSE)->condition('is_default', 0)->count()->execute();
          $info('OAuth clients', "$clients, created at runtime");

          echo $failed ? "RESULT: FAIL\n" : "RESULT: PASS\n";

          // drush php:script reports success whatever the script printed, so end
          // normally on PASS and throw on FAIL to get a non-zero status.
          if ($failed) {
            throw new \RuntimeException('One or more checks failed.');
          }
          PHP
          )"

      - name: Serve the site for the functional tests
        working-directory: site
        run: |
          # The Webmaster in cucumber.shared.js is uid 1.
          bin/drush php:eval '$u = \Drupal\user\Entity\User::load(1); $u->setUsername("webmaster"); $u->setEmail("webmaster@example.test"); $u->setPassword("dD.123123ddd"); $u->save();'
          # Headless test prep, as Vardot's recipe CI does on Varbase sites.
          bin/drush pm:uninstall antibot big_pipe seckit -y || true
          bin/drush config:set system.performance css.preprocess 0 -y
          bin/drush config:set system.performance js.preprocess 0 -y
          bin/drush cr
          # Drupal expects the docroot as the working directory: from anywhere else
          # plugin discovery finds nothing and every page is a 500.
          (cd web && PHP_CLI_SERVER_WORKERS=8 nohup php -S 127.0.0.1:8080 .ht.router.php > /tmp/php-server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8080/user/login && break; sleep 2; done
          curl -s -o /dev/null -w 'user/login: HTTP %{http_code}\n' http://127.0.0.1:8080/user/login

      - name: Check the OAuth discovery documents and the challenge on /mcp
        run: |
          set -e
          BASE=http://127.0.0.1:8080
          for path in /.well-known/oauth-authorization-server /.well-known/oauth-protected-resource /.well-known/oauth-protected-resource/mcp; do
            code=$(curl -s -o /tmp/doc.json -w '%{http_code}' "$BASE$path")
            echo "$path: HTTP $code"
            test "$code" = 200
            python3 -c 'import json,sys; json.load(open("/tmp/doc.json"))'
          done
          # An MCP call without a token must be refused with a Bearer challenge.
          code=$(curl -s -D /tmp/mcp-headers.txt -o /dev/null -w '%{http_code}' -X POST "$BASE/mcp" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0.0"}}}')
          echo "POST /mcp without a token: HTTP $code"
          grep -i '^www-authenticate:' /tmp/mcp-headers.txt
          test "$code" = 401
          grep -qi '^www-authenticate: *bearer' /tmp/mcp-headers.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the functional tests (Playwright + Cucumber)
        working-directory: recipe
        env:
          LAUNCH_URL: http://127.0.0.1:8080
        run: |
          echo "nodeLinker: node-modules" > .yarnrc.yml
          corepack enable
          # varbase-e2e's postinstall can rewrite cucumber.js; keep ours.
          cp cucumber.js /tmp/cucumber.js.bak
          yarn install
          cp /tmp/cucumber.js.bak cucumber.js
          ./node_modules/.bin/playwright install --with-deps chromium
          yarn test

      - name: Keep the test reports and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functional-tests
          path: |
            recipe/tests/reports/
            recipe/tests/screenshots/
            /tmp/php-server.log
          if-no-files-found: ignore
